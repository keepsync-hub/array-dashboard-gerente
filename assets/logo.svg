<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 130" role="img" aria-label="Tecnodata S.A.">
  <title>Tecnodata S.A.</title>
  <defs>
    <linearGradient id="brandBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7BA6D0"/>
      <stop offset="1" stop-color="#4E7BA6"/>
    </linearGradient>
  </defs>
  <!-- Arco / swoosh circular a la izquierda -->
  <path d="M96 24 A46 46 0 1 0 96 106"
        fill="none" stroke="url(#brandBlue)" stroke-width="11" stroke-linecap="round"/>
  <!-- Wordmark: 'tecnodata' azul + ' s.a.' gris (tspan para evitar solapamiento) -->
  <text x="120" y="90"
        font-family="'Trebuchet MS','Segoe UI',Verdana,sans-serif"
        font-size="72" font-weight="700" letter-spacing="-2">
    <tspan fill="url(#brandBlue)">tecnodata</tspan><tspan dx="14" fill="#9AA0A6">s.a.</tspan>
  </text>
</svg>
